<div class="cmd-input-wrapper">
	@for (breadcrumbTitle of displayBreadcrumbs(); track $index) {
		@if (!$first) {
			<span class="cmd-breadcrumb-separator" aria-hidden="true">›</span>
		}
		<span class="cmd-breadcrumb-chip">{{ breadcrumbTitle }}</span>
	}
	<input
		#inputEl
		type="text"
		role="combobox"
		aria-expanded="true"
		aria-controls="cmd-listbox"
		aria-autocomplete="list"
		[attr.aria-label]="palette.inputAriaLabel()"
		[attr.aria-activedescendant]="activeDescendantId()"
		[placeholder]="palette.activePlaceholder()"
		(input)="onInput($event)"
		(keydown)="onKeydown($event)"
	/>
</div>
